<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Generator | Trifecta.Systems</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="antialiased bg-slate-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold text-center mb-8">Blog Post Generator</h1>
        
        <div class="max-w-4xl mx-auto">
            <form id="blogForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="title" class="block text-sm font-medium mb-2">Title</label>
                        <input type="text" id="title" name="title" required class="w-full p-3 bg-slate-800 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    
                    <div>
                        <label for="slug" class="block text-sm font-medium mb-2">Slug (URL-friendly)</label>
                        <input type="text" id="slug" name="slug" required class="w-full p-3 bg-slate-800 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>

                <div>
                    <label for="description" class="block text-sm font-medium mb-2">Meta Description</label>
                    <textarea id="description" name="description" rows="3" required class="w-full p-3 bg-slate-800 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>

                <div>
                    <label for="excerpt" class="block text-sm font-medium mb-2">Excerpt (Short summary)</label>
                    <textarea id="excerpt" name="excerpt" rows="2" required class="w-full p-3 bg-slate-800 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div>
                        <label for="category" class="block text-sm font-medium mb-2">Category</label>
                        <select id="category" name="category" required class="w-full p-3 bg-slate-800 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="Cybersecurity">Cybersecurity</option>
                            <option value="Web Dev">Web Development</option>
                            <option value="Data Analytics">Data Analytics</option>
                            <option value="Tech Trends">Tech Trends</option>
                            <option value="AI & ML">AI & ML</option>
                        </select>
                    </div>
                    
                    <div>
                        <label for="category_color" class="block text-sm font-medium mb-2">Category Color</label>
                        <select id="category_color" name="category_color" required class="w-full p-3 bg-slate-800 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="red">Red (Cybersecurity)</option>
                            <option value="green">Green (Web Dev)</option>
                            <option value="blue">Blue (Data Analytics)</option>
                            <option value="purple">Purple (Tech Trends)</option>
                            <option value="yellow">Yellow (AI & ML)</option>
                        </select>
                    </div>
                    
                    <div>
                        <label for="date" class="block text-sm font-medium mb-2">Date</label>
                        <input type="date" id="date" name="date" required class="w-full p-3 bg-slate-800 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    
                    <div>
                        <label for="read_time" class="block text-sm font-medium mb-2">Read Time (minutes)</label>
                        <input type="number" id="read_time" name="read_time" min="1" max="60" required class="w-full p-3 bg-slate-800 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>

                <div>
                    <label for="content" class="block text-sm font-medium mb-2">Content (Markdown)</label>
                    <textarea id="content" name="content" rows="20" required class="w-full p-3 bg-slate-800 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent font-mono text-sm"></textarea>
                    <p class="text-sm text-gray-400 mt-2">Write your content in Markdown format. Use ## for headings, ** for bold, * for italic, etc.</p>
                </div>

                <div class="flex justify-center">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-slate-900 transition-colors duration-200">
                        Generate Blog Post
                    </button>
                </div>
            </form>

            <div id="output" class="mt-8 hidden">
                <h2 class="text-2xl font-bold mb-4">Generated Files</h2>
                
                <div class="space-y-6">
                    <div>
                        <h3 class="text-lg font-semibold mb-2">Markdown File</h3>
                        <div class="bg-slate-800 rounded-lg p-4">
                            <pre id="markdownOutput" class="text-sm text-gray-300 whitespace-pre-wrap"></pre>
                        </div>
                        <button id="downloadMarkdown" class="mt-2 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm transition-colors duration-200">
                            Download Markdown File
                        </button>
                    </div>

                    <div>
                        <h3 class="text-lg font-semibold mb-2">Blog System Update</h3>
                        <div class="bg-slate-800 rounded-lg p-4">
                            <pre id="blogSystemUpdate" class="text-sm text-gray-300 whitespace-pre-wrap"></pre>
                        </div>
                        <button id="copyBlogSystemUpdate" class="mt-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm transition-colors duration-200">
                            Copy to Clipboard
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Set default date to today
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
            
            // Auto-generate slug from title
            document.getElementById('title').addEventListener('input', function() {
                const title = this.value;
                const slug = title
                    .toLowerCase()
                    .replace(/[^a-z0-9\s-]/g, '')
                    .replace(/\s+/g, '-')
                    .replace(/-+/g, '-')
                    .trim();
                document.getElementById('slug').value = slug;
            });

            // Auto-select category color based on category
            document.getElementById('category').addEventListener('change', function() {
                const category = this.value;
                const colorMap = {
                    'Cybersecurity': 'red',
                    'Web Dev': 'green',
                    'Data Analytics': 'blue',
                    'Tech Trends': 'purple',
                    'AI & ML': 'yellow'
                };
                document.getElementById('category_color').value = colorMap[category] || 'gray';
            });

            document.getElementById('blogForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const formData = new FormData(this);
                const data = Object.fromEntries(formData);
                
                // Format date for display
                const displayDate = new Date(data.date).toLocaleDateString('en-US', { 
                    month: 'short', 
                    day: 'numeric', 
                    year: 'numeric' 
                });
                
                // Format date for published_time
                const publishedTime = new Date(data.date).toISOString();
                
                // Generate Markdown content with front matter
                const markdownContent = `---
title: "${data.title}"
description: "${data.description}"
excerpt: "${data.excerpt}"
category: "${data.category}"
category_color: "${data.category_color}"
date: "${displayDate}"
read_time: ${data.read_time}
published_time: "${publishedTime}"
slug: "${data.slug}"
---

${data.content}`;

                // Generate blog system update
                const blogSystemUpdate = `{
    slug: '${data.slug}',
    markdownFile: 'blog-posts/${data.slug}.md',
    title: '${data.title}',
    description: '${data.description}',
    excerpt: '${data.excerpt}',
    category: '${data.category}',
    category_color: '${data.category_color}',
    date: '${displayDate}',
    read_time: ${data.read_time},
    published_time: '${publishedTime}'
}`;

                // Display output
                document.getElementById('markdownOutput').textContent = markdownContent;
                document.getElementById('blogSystemUpdate').textContent = blogSystemUpdate;
                document.getElementById('output').classList.remove('hidden');

                // Scroll to output
                document.getElementById('output').scrollIntoView({ behavior: 'smooth' });
            });

            // Download Markdown file
            document.getElementById('downloadMarkdown').addEventListener('click', function() {
                const content = document.getElementById('markdownOutput').textContent;
                const blob = new Blob([content], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${document.getElementById('slug').value}.md`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });

            // Copy blog system update
            document.getElementById('copyBlogSystemUpdate').addEventListener('click', function() {
                const content = document.getElementById('blogSystemUpdate').textContent;
                navigator.clipboard.writeText(content).then(() => {
                    this.textContent = 'Copied!';
                    setTimeout(() => {
                        this.textContent = 'Copy to Clipboard';
                    }, 2000);
                });
            });
        });
    </script>
</body>
</html>
