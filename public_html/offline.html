<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Trifecta.Systems</title>
    <meta name="description" content="You are currently offline. Please check your internet connection and try again.">
    
    <!-- Google tag (gtag.js) with Consent Mode -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-F8YR6XDE82"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    
    // Default consent state - deny all until user consent is given
    gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'functionality_storage': 'denied',
        'personalization_storage': 'denied',
        'security_storage': 'granted',
        'wait_for_update': 500
    });
    
    gtag('js', new Date());
    gtag('config', 'G-F8YR6XDE82', {
        'anonymize_ip': true
    });
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="Gallery/favicon/favicon-96x96.png" sizes="96x96" />
</head>
<body class="antialiased bg-[#0F131C] text-white min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4 text-center">
        <div class="max-w-md mx-auto">
            <img src="Gallery/Trifecta_Logo.png" alt="Trifecta.Systems Logo" class="w-24 h-24 mx-auto mb-8 rounded-md">
            <h1 class="text-4xl font-bold mb-4">You're Offline</h1>
            <p class="text-xl text-gray-300 mb-8">
                It looks like you've lost your internet connection. Don't worry - some parts of our site are available offline.
            </p>
            <div class="space-y-4">
                <button onclick="window.location.reload()" class="bg-white text-[#0F131C] font-bold py-3 px-8 rounded-full hover:bg-gray-200 transition duration-300 ease-in-out transform hover:scale-105">
                    Try Again
                </button>
                <p class="text-sm text-gray-500">
                    Or check your internet connection and refresh the page
                </p>
            </div>
        </div>
    </div>
</body>
</html>
